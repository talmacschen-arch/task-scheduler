#=============================================================================
# env.conf - 任务调度系统环境配置
#
# 移植到 OpenClaw 时，只需修改此文件中的路径即可。
# 也可以通过环境变量 TASK_SCHEDULER_HOME 覆盖安装目录。
#=============================================================================

# 安装根目录（所有路径基于此目录）
# 如果设置了环境变量 TASK_SCHEDULER_HOME，优先使用环境变量
# TASK_SCHEDULER_HOME="/opt/task-scheduler"

# 任务配置文件路径（相对于根目录）
TASK_CONFIG="conf/tasks.conf"

# 日志目录（相对于根目录）
TASK_LOG_DIR="logs"

# PID 文件目录（相对于根目录）
TASK_RUN_DIR="run"

# 日志保留天数
TASK_LOG_RETAIN_DAYS=31

# 日志清理间隔（秒），默认每 6 小时
TASK_LOG_CLEANUP_INTERVAL=21600

# 调度器检查间隔（秒），对齐到每分钟
TASK_POLL_INTERVAL=60

# 默认任务超时（秒），0 表示不限制
TASK_DEFAULT_TIMEOUT=0

# 日志级别: DEBUG=0, INFO=1, WARN=2, ERROR=3
TASK_LOG_LEVEL=1

# Python3 路径（如果不在 PATH 中，在此指定绝对路径）
TASK_PYTHON3="python3"
